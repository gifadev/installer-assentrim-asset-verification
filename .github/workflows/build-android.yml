name: Build Android APK (Assentrim Asset Verification)

on:
  workflow_dispatch:

jobs:
  build-apk:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Install Capacitor & Generate Android Project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Assentrim Asset Verification" "com.assentrim.verification" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Assentrim-Asset-Verification-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
